[package]
name = "candle-sam3"
version = "0.1.0"
edition = "2021"
description = "SAM 3 (Segment Anything with Concepts) image and video inference for Candle"
repository = "https://github.com/den-sq/candle-sam3"
license-file = "LICENSE-SAM"
readme = "README.md"
publish = false

[dependencies]
candle = { package = "candle-core", git = "https://github.com/den-sq/candle", rev = "9af0337b7784d638c14f3234b0ebca0971768207" }
candle-nn = { git = "https://github.com/den-sq/candle", rev = "9af0337b7784d638c14f3234b0ebca0971768207" }
candle-transformers = { git = "https://github.com/den-sq/candle", rev = "9af0337b7784d638c14f3234b0ebca0971768207" }
half = "2.5.0"
image = { version = "0.25.2", default-features = false, features = ["jpeg", "png"], optional = true }
serde = { version = "1.0.171", features = ["derive"] }
serde_json = "1.0.99"
tokenizers = { version = "0.22.0", default-features = false, features = ["onig"] }

[dev-dependencies]
anyhow = { version = "1", features = ["backtrace"] }
clap = { version = "4.2.4", features = ["derive"] }
image = { version = "0.25.2", default-features = false, features = ["jpeg", "png"] }
imageproc = { version = "0.26.0", default-features = false, features = ["text"] }

[build-dependencies]
cc = "1"

[features]
default = []
cuda = ["candle/cuda", "candle-nn/cuda", "candle-transformers/cuda"]
cudnn = ["candle/cudnn", "candle-nn/cudnn", "candle-transformers/cudnn"]
metal = ["candle/metal", "candle-nn/metal", "candle-transformers/metal"]
# Caller-owned media adapters (image decoding, PNG debug sinks) used by the examples.
media = ["dep:image"]
sam3-parity-support = []
sam3-nvtx = []

[[example]]
name = "sam3"
path = "examples/sam3/main.rs"
required-features = ["media"]

[[example]]
name = "sam3_debug"
path = "examples/sam3_debug.rs"
